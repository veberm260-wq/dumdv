<!--
  ШАБЛОН КАРТОЧКИ — при переносе в тему WordPress поля подставляются так:

  <a class="tile" href="<?php the_permalink(); ?>">
    <div class="shot">
      <?php the_post_thumbnail('large', ['loading' => 'lazy',
            'alt' => get_the_title()]); ?>            ← обложка: the_post_thumbnail
    </div>
    <time class="tile-d" datetime="<?php echo get_the_date('c'); ?>">
      <?php echo get_the_date('j F Y'); ?></time>     ← дата: get_the_date
    <h3 class="tile-t"><?php the_title(); ?></h3>     ← заголовок: the_title
    <p class="tile-x"><?php the_excerpt(); ?></p>     ← анонс: the_excerpt
  </a>

  Рубрика в главной карточке — get_the_category()[0]->name.
  Нет обложки → вместо <img> выводится <div class="stub">.
  Нет анонса → <p class="tile-x"> не выводится, остаётся только заголовок.
  Пока карточки собираются скриптом из v2/data/news.json (выгрузка REST API).
-->

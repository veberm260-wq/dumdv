<!--
  ШАБЛОН КАРТОЧКИ НОВОСТИ — при переносе в тему WordPress поля подставляются так:

  <a class="card" href="<?php the_permalink(); ?>">
    <div class="card-shot">
      <?php the_post_thumbnail('large', [
            'class' => '', 'loading' => 'lazy',
            'alt' => get_the_title() ]); ?>   ← обложка: featured_media
    </div>
    <div class="card-veil"></div>
    <div class="card-in">
      <span class="card-cat"><?php echo get_the_category()[0]->name; ?></span>  ← рубрика
      <h3 class="card-t"><?php the_title(); ?></h3>                             ← заголовок
      <time class="card-d" datetime="<?php echo get_the_date('c'); ?>">
        <?php echo get_the_date('j F Y'); ?></time>                             ← дата
    </div>
  </a>

  Если обложки нет — вместо .card-shot выводится <div class="card-stub">.
  Если заголовка нет — <h3> не выводится, остаются рубрика и дата.
